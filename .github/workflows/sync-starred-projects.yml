name: Sync starred projects

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Sync starred repositories
        env:
          GITHUB_USERNAME: ArkaPrabhaChowdhury
          # Optional: add PORTFOLIO_GITHUB_TOKEN to include private starred repos.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
        run: node scripts/sync-starred-repositories.mjs

      - name: Commit generated portfolio data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/generated-projects.ts
          git diff --cached --quiet || git commit -m "chore: sync starred projects"
          git push
